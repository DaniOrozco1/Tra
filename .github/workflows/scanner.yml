name: Escaner HA 1h

on:
  schedule:
    - cron: "3 * * * *"        # cada hora, al minuto 3 (hora UTC); el script filtra 8:00-00:00 Madrid
  workflow_dispatch:
    inputs:
      prueba:
        description: "Modo prueba (ignora el horario y manda un resumen a Telegram)"
        type: boolean
        default: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scanner.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE: ${{ inputs.prueba && '1' || '0' }}
